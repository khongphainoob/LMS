map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    client_max_body_size 100m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Gunicorn không phục vụ static, nginx đọc thẳng từ volume bench-data (mount read-only)
    location /assets/ {
        alias /home/frappe/data/frappe-bench/sites/assets/;
        expires 7d;
        try_files $uri =404;
    }

    location /files/ {
        root /home/frappe/data/frappe-bench/sites/lms.localhost/public;
        try_files $uri @app;
    }

    # Realtime (tiến độ chấm bài) đi qua Socket.IO của Frappe
    location /socket.io/ {
        proxy_pass http://frappe:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Frappe-Site-Name lms.localhost;
    }

    location / {
        try_files /dev/null @app;
    }

    location @app {
        proxy_pass http://frappe:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Frappe-Site-Name lms.localhost;
        proxy_read_timeout 300s;
    }
}
